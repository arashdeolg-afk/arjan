name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual re-run when a webhook delivery is dropped

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
