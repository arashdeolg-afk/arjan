# Deol Tech — single-host deployment.
#
#   cp deploy/.env.example .env    &&  edit it (DEOLTECH_SECRET is required)
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec app \
#       python -m deoltech admin create
#
# The app listens on 127.0.0.1 only. Anything reaching it from outside comes
# through the TLS-terminating proxy, which is the only thing that should be
# exposed to the internet.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deoltech:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DEOLTECH_DB: /data/deoltech.db
      DEOLTECH_HOST: 0.0.0.0
      DEOLTECH_PORT: "8000"
    volumes:
      - deoltech-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The app needs to write only its database.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx.conf `include`s this; without it the proxy fails to start.
      - ./deoltech_headers.conf:/etc/nginx/conf.d/deoltech_headers.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro

volumes:
  deoltech-data:
  certbot-webroot:
