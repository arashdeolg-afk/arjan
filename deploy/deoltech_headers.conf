# Shared proxy headers. Included by every location block in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Host              $host;
# Overwrite, never append: a client-supplied X-Forwarded-For would otherwise
# let anyone spoof their IP past the login rate limiter and into the audit log.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Connection        "";
proxy_read_timeout 60s;
proxy_send_timeout 60s;
