# TLS termination and reverse proxy for Deol Tech.
#
# Two jobs beyond forwarding: terminate HTTPS (the app sets Secure cookies and
# HSTS, which only make sense behind real TLS), and overwrite X-Forwarded-For
# so the app's rate limiter and audit log record the true client IP. A client
# that sets its own X-Forwarded-For must not be believed — using $proxy_add_
# x_forwarded_for here instead would let anyone forge their address and evade
# the login throttle.

limit_req_zone $binary_remote_addr zone=deoltech_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=deoltech_api:10m rate=240r/m;

upstream deoltech_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ACME challenges must stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    # OCSP stapling silently does nothing without a resolver; 127.0.0.11 is
    # Docker's embedded DNS, which is what this container actually has.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;      # matches the app's own body cap

    location = /api/health {
        proxy_pass http://deoltech_app;
        access_log off;
    }

    location = /login {
        limit_req zone=deoltech_login burst=5 nodelay;
        proxy_pass http://deoltech_app;
        include /etc/nginx/conf.d/deoltech_headers.conf;
    }

    location /api/ {
        limit_req zone=deoltech_api burst=60 nodelay;
        proxy_pass http://deoltech_app;
        include /etc/nginx/conf.d/deoltech_headers.conf;
    }

    location /static/ {
        proxy_pass http://deoltech_app;
        proxy_cache_valid 200 5m;
        include /etc/nginx/conf.d/deoltech_headers.conf;
    }

    location / {
        proxy_pass http://deoltech_app;
        include /etc/nginx/conf.d/deoltech_headers.conf;
    }
}
