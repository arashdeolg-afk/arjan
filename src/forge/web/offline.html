<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e13">
  <title>Forge — offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: #0b0e13; color: #dfe7f2;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 380px; }
    .icon { width: 72px; height: 72px; margin: 0 auto 18px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8fa3bd; margin-bottom: 10px; }
    code {
      display: inline-block; margin-top: 2px; padding: 6px 10px; border-radius: 8px;
      background: #10141b; border: 1px solid #232b38; color: #ffb054;
      font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    button {
      margin-top: 20px; padding: 10px 22px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #ffb054, #ff5d73); color: #171004;
      font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb054"/><stop offset="1" stop-color="#ff5d73"/>
      </linearGradient></defs>
      <rect width="64" height="64" rx="14" fill="#10141b"/>
      <g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="24 22 14 32 24 42"/><polyline points="40 22 50 32 40 42"/>
        <line x1="35" y1="18" x2="29" y2="46"/>
      </g>
    </svg>
    <h1>Forge can't be reached</h1>
    <p>You're offline, or the Forge server isn't running on this machine.</p>
    <p>Start it with<br><code>PYTHONPATH=src python3 -m forge</code></p>
    <button onclick="location.replace('/')">Try again</button>
  </div>
</body>
</html>
